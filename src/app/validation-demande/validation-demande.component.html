<div class="content-wrapper">
    <div class="row">
  
  
      <div class="col-lg-12 grid-margin stretch-card">
        <div class="card">
          <div class="card-body">
            <p class="card-description">
              List des Demandes
            </p>
         
            <div class="table-responsive">
  
              <table class="table table-striped">
                <thead>
                <tr>
                  <th>
                    Id Employe
                   </th>
                  <th>
                    Id Formation 
                  </th>
                  <th>
                    Titre
                  </th>
                  <th>
                   Decession
                  </th>
  
                </tr>
                </thead>
                <tbody>
                <tr *ngFor=" let demande of demandes">
                  <td >{{demande.idAttri}}</td>
                  <td>{{demande.formation.idFor}}</td>
                  <td>{{demande.formation.titre}}</td>
                  <td> 
                    <input type="radio" class="btn-check" name="options-outlined" id="success-outlined" autocomplete="off" checked  >
                    <label class="btn btn-outline-success" for="success-outlined" (click)="selectDemande(demande)" (click)="updateProduit()" onclick="location.reload();">ok</label>
                    <br> 
                    <input type="radio" class="btn-check" name="options-outlined" id="danger-outlined" autocomplete="off">
                    <label class="btn btn-outline-danger" for="danger-outlined">Non</label>
                  </td>
                
                
  
                </tr>
  
  
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
      <pagination-controls (pageChange)="p = $event"></pagination-controls>
  
    </div>
  </div>
